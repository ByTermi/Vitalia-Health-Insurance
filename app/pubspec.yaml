name: vitalia_har
description: Vitalia Health Insurance — HAR + Fall Detection demo (on-device TFLite)
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  sensors_plus: ^7.0.0
  permission_handler: ^11.0.0
  collection: ^1.18.0
  http: ^1.2.0
  fl_chart: ^0.69.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
